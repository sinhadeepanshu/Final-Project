<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – PayVanta AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>🏦 PayVanta AI</h1>
      <p>Intelligent High-Value Payment Platform</p>
    </div>
    <div class="auth-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <!-- Tabs: User Login + Sign Up only -->
      <div class="auth-tabs">
        <button class="auth-tab {% if active_tab=='user' %}active{% endif %}" onclick="switchTab('user')">👤 User Login</button>
        <button class="auth-tab {% if active_tab=='signup' %}active{% endif %}" onclick="switchTab('signup')">✨ Sign Up</button>
      </div>

      <!-- User Login -->
      <div id="tab-user" class="tab-content" style="display:{% if active_tab=='user' %}block{% else %}none{% endif %}">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="tab" value="user">
          <div class="form-group">
            <label class="form-label">Phone / Email</label>
            <input type="text" name="identifier" class="form-control" placeholder="+91XXXXXXXXXX or email" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Login & Get OTP →</button>
        </form>
      </div>

      <!-- Sign Up -->
      <div id="tab-signup" class="tab-content" style="display:{% if active_tab=='signup' %}block{% else %}none{% endif %}">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="tab" value="signup">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Rahul Sharma" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="+91XXXXXXXXXX or 10-digit" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create Account →</button>
        </form>
      </div>

      <div style="text-align:center; margin-top:12px;">
        <a href="{{ url_for('auth.forgot_password') }}" class="text-muted text-sm">🔒 Forgot Password?</a>
      </div>

      <!-- Admin & Bank portal links -->
      <div style="text-align:center; margin-top:10px; padding-top:10px; border-top:1px solid #e2e8f0; display:flex; justify-content:center; gap:20px;">
        <a href="{{ url_for('auth.admin_login') }}" class="text-muted text-sm" style="color:#64748b;">
          🔐 Admin Portal
        </a>
        <span style="color:#e2e8f0;">|</span>
        <a href="{{ url_for('bank.login') }}" class="text-muted text-sm" style="color:#667eea;">
          🏦 Bank Officer Portal
        </a>
      </div>

      <p class="text-muted text-sm mt-8" style="text-align:center">
        Secured with OTP verification &amp; AI fraud detection
      </p>
    </div>
  </div>
</div>
<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = 'block';
  const idx = ['user','signup'].indexOf(tab);
  document.querySelectorAll('.auth-tab')[idx].classList.add('active');
}
</script>
</body>
</html>
