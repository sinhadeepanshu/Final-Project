<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – PayVanta AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>🔒 Forgot Password</h1>
      <p>Enter your phone or email to reset password</p>
    </div>
    <div class="auth-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label">Phone Number or Email</label>
          <input type="text" name="identifier" class="form-control"
                 placeholder="+91XXXXXXXXXX or email" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">
          Send OTP →
        </button>
      </form>

      <p style="text-align:center; margin-top:16px;">
        <a href="{{ url_for('auth.login') }}" class="text-muted text-sm">← Back to Login</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
